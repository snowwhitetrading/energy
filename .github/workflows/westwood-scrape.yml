name: Westwood jackup scrape

# The weekly scrape runs on the Windows server (setup_server.ps1, Friday 18:00); this workflow
# remains for manual runs and reloads ThiTruongKhoan.csv when it is edited on github.com.

on:
  # Editing ThiTruongKhoan.csv (here or on github.com) reloads it straight away.
  push:
    branches: [main]
    paths:
      - "ThiTruongKhoan.csv"
  workflow_dispatch: {}

concurrency:
  group: westwood-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape Westwood into dc_commodity.ThiTruongKhoan
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python ThiTruongKhoan.py --all

      - name: Load the South East Asia series from ThiTruongKhoan.csv
        env:
          IRIS_MONGO_URI: ${{ secrets.DATABASE }}
        run: python ThiTruongKhoan.py --import-sea
